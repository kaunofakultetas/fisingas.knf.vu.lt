openapi: 3.0.3
info:
  title: Fisingas API
  description: |
    Phishing Recognition Test Platform API.

    ## Authentication

    Authentication is session-based using cookies. Log in via `POST /api/login` to receive
    a session cookie (named `session`, `HttpOnly`), which is then sent automatically with
    subsequent requests. The cookie expires when the browser closes; `POST /api/logout`
    ends the session **server-side** (deletes the session row and clears the cookie).

    The system has two user roles, distinguished by the login name:
    - **Admin** -- identified by an email address (contains `@`); password checked against a bcrypt hash
    - **Student** -- identified by a generated username (`A-Z`, `0-9`, `_` only, so it can never contain `@`);
      password is the system-generated 8-digit access code

    ## Authorization levels

    Each endpoint is one of:
    - **Public** -- no session required
    - **Login** -- any authenticated user (admin or student)
    - **Student** -- student session (admins get an empty response)
    - **Admin** -- administrator session
    - **Admin or self** -- administrator session, or a student accessing their own record

    ## Error conventions

    The API predates a uniform error contract; clients must handle three conventions:

    1. **Plain-text protocol** -- `POST /api/login`, `POST /api/logout`,
       `POST /api/student/questions` and `POST /api/phishingpictures/{id}/links` respond
       with the literal string `OK` on success and a message string on failure. Login and
       the answers save always use HTTP 200 (including their validation messages); the
       links endpoint can additionally return `400`/`404`, and the answers save responds
       with the JSON object `{}` (not text) for admin sessions and finished tests.
       **All of these "plain-text" bodies are served with Django's default
       `Content-Type: text/html`** -- the body is a bare string either way.
    2. **Object protocol** -- upload and administrator endpoints respond with
       `{"type": "ok" | "error", "reason": ...}`; question/student mutations respond with
       `{"status": "ok"}`.
    3. **Role-gate quirk** -- several admin endpoints reject non-admins with the
       plain-text body `Error: Not Admin` and **HTTP 200**. Do not rely on the status code
       alone; check the body. Most mutating admin endpoints return a proper `403` --
       except `POST /api/admin/administrators` and
       `POST /api/phishingpictures/{id}/links`, which use the same 200-with-body
       rejection as the GETs.

    Malformed JSON bodies return `400` on the object-protocol endpoints (and on
    `/api/student/register` and the links POST); `POST /api/login` and
    `POST /api/student/questions` answer them with an HTTP 200 message instead. A
    syntactically valid body with missing keys fails loudly with a `500` on the admin
    endpoints (no field-level validation by design); the answers save validates its whole
    payload shape up front and refuses bad shapes with the 200 error string, but
    non-numeric **values** in it still fail with a `500`.
  version: 2.2.0

servers:
  - url: /
    description: Same-origin (behind the Caddy reverse proxy)

tags:
  - name: Authentication
    description: Login and session checks
  - name: Student Registration
    description: Public self-service student registration
  - name: Phishing Test
    description: Student test-taking endpoints (deal, answer, finish)
  - name: Questions (Admin)
    description: Question bank management
  - name: Question Images
    description: Screenshot upload, retrieval and clickable link areas
  - name: Students (Admin)
    description: Student monitoring, results and deletion
  - name: Administrators
    description: Administrator account management
  - name: Dashboard
    description: Admin dashboard and global settings
  - name: Public
    description: Unauthenticated leaderboard and projector slides

paths:

  # ──────────────────────────────────────────────
  # Authentication
  # ──────────────────────────────────────────────

  /api/login:
    post:
      tags: [Authentication]
      summary: Log in
      description: |
        **Auth: Public.**

        Log in as admin or student. The system distinguishes the two by whether the
        submitted name contains `@` (admin email) or not (student username).

        The response is **always HTTP 200** with a plain-text body: `OK` on success
        (session cookie set), or a display-ready Lithuanian error message on failure.
        Failed logins for unknown names still perform a dummy bcrypt comparison to
        prevent timing-based user enumeration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Email (admin) or username (student)
                  example: admin@admin.com
                password:
                  type: string
                  description: Password (admin) or 8-digit access code (student)
                  example: admin
      responses:
        "200":
          description: |
            Login result (always 200). `OK` on success; otherwise one of:
            - `Įveskite Prisijungimo Vardą ir Slaptažodį.` (both fields missing)
            - `Įveskite Prisijungimo Vardą.` (username missing)
            - `Įveskite Slaptažodį.` (password missing)
            - `El. Paštas ir/arba Slaptažodis neteisingas.` (admin login failed)
            - `Vardas ir/arba Slaptažodis neteisingas.` (student login failed)
          content:
            text/html:
              schema:
                type: string
                example: OK
          headers:
            Set-Cookie:
              description: "`session` cookie (set on success; expires when the browser closes)"
              schema:
                type: string

  /api/logout:
    post:
      tags: [Authentication]
      summary: Log out
      description: |
        **Auth: Public** (harmless without a session).

        Deletes the current session **server-side** (the `django_session` row) and
        clears the `session` cookie in the response — a cookie value captured
        before logging out is dead from this moment. `POST` only: a cross-site
        top-level `GET` navigation must not be able to log anyone out.
      responses:
        "200":
          description: Logged out (plain-text body `OK`); also returned when no session existed
          content:
            text/html:
              schema:
                type: string
                example: OK
          headers:
            Set-Cookie:
              description: "`session` cookie cleared"
              schema:
                type: string
        "405":
          description: Method not allowed (only `POST`)

  /api/checkauth:
    get:
      tags: [Authentication]
      summary: Check current session
      description: |
        **Auth: Login.**

        Returns the current user's identity and, as a side effect, updates the
        account's last-login timestamp (this is the "last seen" heartbeat that feeds
        the dashboard and leaderboard views).

        - `id` is the login name (email for admin, username for student)
        - `userid` is the database primary key (integer)
        - students additionally receive their `passcode` and test-finished flag
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Current user info
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AdminAuth"
                  - $ref: "#/components/schemas/StudentAuth"
              examples:
                admin:
                  summary: Admin user
                  value:
                    id: admin@admin.com
                    userid: 1
                    admin: 1
                student:
                  summary: Student user
                  value:
                    id: JOHN_DOE
                    userid: 5
                    admin: 0
                    passcode: "48291037"
                    phishingtestfinished: 0
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/checkauth/admin:
    get:
      tags: [Authentication]
      summary: Check admin session
      description: |
        **Auth: Admin.**

        Same as `/api/checkauth` but returns `401` unless the session belongs to an
        administrator. Used by the Caddy endpoint as the `forward_auth` gate for the
        admin-only tools (`/dbgate`, `/filebrowser/*`, `/swagger`). Also updates the
        administrator's last-login timestamp.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Admin user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAuth"
        "401":
          description: |
            Two different bodies share this status: an **anonymous** request gets the
            plain-text body `Unauthorized` (served as `text/html`), while an
            authenticated **non-admin** session gets the JSON object
            `{"message": "Unauthorized"}`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Unauthorized
            text/html:
              schema:
                type: string
                example: Unauthorized

  # ──────────────────────────────────────────────
  # Student Registration
  # ──────────────────────────────────────────────

  /api/student/register:
    post:
      tags: [Student Registration]
      summary: Register a new student
      description: |
        **Auth: Public.**

        Register a new student account. The submitted username is uppercased and every
        character outside `A-Z`, `0-9`, `_` is stripped; the normalized name is what
        gets registered. On success the response carries the system-generated 8-digit
        access code -- it is returned **only here** and shown to the student once
        (administrators can look it up later on the student detail endpoint).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  description: Desired username (will be normalized)
                  example: John_Doe
      responses:
        "200":
          description: Registration result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [OK, error]
                  username:
                    type: string
                    description: The normalized username (only on success)
                    example: JOHN_DOE
                  accessCode:
                    type: string
                    description: 8-digit access code (only on success; shown once)
                    example: "48291037"
                  error:
                    type: string
                    description: Error message (only on failure)
              examples:
                success:
                  summary: Successful registration
                  value:
                    status: OK
                    username: JOHN_DOE
                    accessCode: "48291037"
                duplicate:
                  summary: Username already taken
                  value:
                    status: error
                    error: Vartotojas tokiu vardu jau registruotas
                empty:
                  summary: Username empty after normalization
                  value:
                    status: error
                    error: Įveskite prisijungimo vardą
        "400":
          description: Malformed body (missing or non-string `username`)
          content:
            application/json:
              schema:
                type: object
                example:
                  status: error
                  error: Neteisinga užklausa

  # ──────────────────────────────────────────────
  # Phishing Test (Student)
  # ──────────────────────────────────────────────

  /api/student/questions:
    get:
      tags: [Phishing Test]
      summary: Get dealt test questions
      description: |
        **Auth: Student.**

        Returns the student's dealt test questions. The **first call deals the test**:
        a uniform random sample of enabled questions (sample size = the
        `PhishingTestSize` setting, code fallback 30, clamped to the bank size) is
        frozen into per-student snapshot rows. Subsequent calls return the same dealt
        set. The question order is **reshuffled on every call** -- clients that want a
        stable order must keep their own.

        Returns `{}` (an empty object instead of an array) once the test is finished,
        or when called by an admin session.

        The clickable tooltip areas are **not** part of this payload -- fetch
        `/api/phishingpictures/{questionID}/links` per question for the rectangles.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Array of dealt questions, or `{}` if the test is finished
          content:
            application/json:
              schema:
                oneOf:
                  - type: array
                    items:
                      $ref: "#/components/schemas/StudentQuestion"
                  - type: object
                    maxProperties: 0
                    description: Empty object -- finished test or admin session
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Phishing Test]
      summary: Save answers
      description: |
        **Auth: Student.**

        Save the student's answers. The frontend posts the **entire answer state**
        after every click; the call is idempotent and repeatable. Updates only touch
        rows belonging to the calling session's student, so a forged `questionid`
        cannot write into another student's test. Unknown IDs are silently ignored
        (the filtered update matches nothing).

        The whole payload shape is validated **before anything is written**: the body
        must be a list of objects each carrying `questionid`, and `questionoptions`
        must be a list of objects each carrying `answeroptionid` -- anything else is
        refused with the 200 error string and no partial state is saved. Values are
        not validated (a non-numeric `selectedanswer` fails with a `500`).

        Every call (GET or POST) also refreshes the student's `lastseen` timestamp.

        Note: answers of a finished test can no longer be read back (the GET returns
        `{}`), and grading uses the state as it was; the UI never calls this after
        finishing.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required: [questionid]
                properties:
                  questionid:
                    type: integer
                  selectedanswer:
                    type: integer
                    nullable: true
                    description: "`1` = Phishing, `0` = Real, `null` = not answered"
                  questionoptions:
                    type: array
                    items:
                      type: object
                      required: [answeroptionid]
                      properties:
                        answeroptionid:
                          type: integer
                        isselected:
                          type: integer
                          nullable: true
                          description: "`1` = selected, `0` or `null` = not selected"
      responses:
        "200":
          description: |
            `OK` on success (plain text, served as `text/html`). Any shape violation --
            a non-list body, a non-object entry, a missing `questionid`/`answeroptionid`,
            a non-list `questionoptions` -- returns the plain-text error
            `Error: This is not questions state object` (still 200, nothing written).
            Admin sessions and finished tests get the JSON object `{}` instead.
          content:
            text/html:
              schema:
                type: string
                example: OK
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/student/finish:
    get:
      tags: [Phishing Test]
      summary: Finish the test
      description: |
        **Auth: Student.**

        Marks the student's test as finished: grades the frozen answer snapshot,
        writes the whole-test totals into the results table, and sets the finished
        flag. **This is irreversible** -- afterwards `GET /api/student/questions`
        returns `{}` forever.

        The operation is idempotent (a second call is a no-op) and is a no-op for
        admin sessions. Note this is a **state-changing GET**.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Test marked as finished (empty object)
          content:
            application/json:
              schema:
                type: object
                example: {}
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Questions (Admin)
  # ──────────────────────────────────────────────

  /api/admin/questions:
    get:
      tags: [Questions (Admin)]
      summary: List all questions
      description: |
        **Auth: Admin** (non-admins get the plain-text body `Error: Not Admin` with HTTP 200).

        Returns the whole question bank (newest first) with options and summary
        counters. On an **empty bank** the counters `phishingcount`, `goodcount`,
        `enabledcount` and `optionscount` are `null`, not `0`. `phishingtestsize` is
        `null` until an administrator saves the setting for the first time.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Questions with summary counters
          content:
            application/json:
              schema:
                type: object
                properties:
                  questioncount:
                    type: integer
                    description: Total number of questions
                  phishingcount:
                    type: integer
                    nullable: true
                    description: Number of phishing questions (null when the bank is empty)
                  goodcount:
                    type: integer
                    nullable: true
                    description: Number of real (non-phishing) questions (null when the bank is empty)
                  enabledcount:
                    type: integer
                    nullable: true
                    description: Number of enabled questions (null when the bank is empty)
                  optionscount:
                    type: integer
                    nullable: true
                    description: Total number of options across all questions (null when the bank is empty)
                  phishingtestsize:
                    type: integer
                    nullable: true
                    description: Current test size setting (null if never set)
                  questions:
                    type: array
                    items:
                      $ref: "#/components/schemas/AdminQuestion"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/questions/createnewoption:
    post:
      tags: [Questions (Admin)]
      summary: Add a new option to a question
      description: |
        **Auth: Admin** (403 otherwise).

        Creates a new empty answer option (`optiontext` empty, expected value unset)
        for the specified question. Saved immediately; the returned ID is what the
        editor uses for subsequent `updatequestion` calls.

        Returns `404` when the question no longer exists (e.g. deleted by another
        admin while the questions page was still open).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionid]
              properties:
                questionid:
                  type: integer
      responses:
        "200":
          description: New option created
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_option_id:
                    type: integer
        "400":
          $ref: "#/components/responses/InvalidBodyText"
        "403":
          $ref: "#/components/responses/NotAdminText"
        "404":
          description: "The question no longer exists (plain-text body `Error: Question no longer exists`)"
          content:
            text/html:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/questions/updatequestion:
    post:
      tags: [Questions (Admin)]
      summary: Update a question
      description: |
        **Auth: Admin** (403 otherwise).

        Updates a question's text, phishing verdict, enabled flag and options in one
        call (the admin UI autosaves this 500 ms after the last edit). `isenabled` is
        optional -- when omitted, the enabled flag is left unchanged. Option updates
        are filtered by both option ID **and** question ID, so option IDs belonging
        to other questions are silently ignored.

        Editing never affects already-dealt tests: students answer against frozen
        snapshot copies.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionid, questiontext, isphishing, questionoptions]
              properties:
                questionid:
                  type: integer
                questiontext:
                  type: string
                  description: Optional extra instruction shown to the student ("Papildomai")
                isphishing:
                  type: integer
                  description: "`1` = phishing, `0` = real"
                isenabled:
                  type: integer
                  description: "Optional. `1` = dealt to students, `0` = disabled"
                questionoptions:
                  type: array
                  items:
                    type: object
                    required: [optionid, optiontext, rightoptionanswer]
                    properties:
                      optionid:
                        type: integer
                      optiontext:
                        type: string
                      rightoptionanswer:
                        type: integer
                        nullable: true
                        description: "`1` = should be checked, `0` = should not, `null` = not set (never counts as correct)"
      responses:
        "200":
          description: Question updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/InvalidBodyText"
        "403":
          $ref: "#/components/responses/NotAdminText"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/questions/deleteoption:
    post:
      tags: [Questions (Admin)]
      summary: Delete an answer option
      description: |
        **Auth: Admin** (403 otherwise).

        Deletes one answer option from the question bank. Safe for already-graded
        tests -- they read only their frozen snapshot copies. Deleting a nonexistent
        option is a no-op that still returns `ok`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [optionid]
              properties:
                optionid:
                  type: integer
      responses:
        "200":
          description: Option deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/InvalidBodyText"
        "403":
          $ref: "#/components/responses/NotAdminText"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/questions/deletequestion:
    post:
      tags: [Questions (Admin)]
      summary: Delete a question
      description: |
        **Auth: Admin** (403 otherwise).

        Deletes a question and (by cascade) its options from the bank. Safe for
        already-graded tests: the frozen answer snapshots keep the question content,
        and the screenshot -- with its clickable link areas -- lives in the
        upload-only image table that deletion never touches
        (`GET /api/phishingpictures/{id}` keeps working through the snapshot
        fallback). Deleting a nonexistent question is a no-op that still returns `ok`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [questionid]
              properties:
                questionid:
                  type: integer
      responses:
        "200":
          description: Question deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/InvalidBodyText"
        "403":
          $ref: "#/components/responses/NotAdminText"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Question Images
  # ──────────────────────────────────────────────

  /api/phishingpictures:
    post:
      tags: [Question Images]
      summary: Upload an image (creates a new question)
      description: |
        **Auth: Admin** (403 otherwise).

        Creating a question starts here: uploading a screenshot stores it in the
        upload-only image table and creates a wrapper question around it with default
        values (enabled, empty text, `isphishing = 0`). Fill in the details with
        `updatequestion` afterwards.

        Validation: multipart field must be named `image`; the filename extension
        must be one of `png`, `jpg`, `jpeg`, `gif`; the file must not exceed 5 MB.
        The image bytes are stored in PostgreSQL as-is (no re-encoding).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
                  description: Image file (PNG, JPG/JPEG, GIF). Max 5 MB.
      responses:
        "200":
          description: Image uploaded, question created
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    example: ok
                  message:
                    type: string
                    example: Image uploaded successfully
        "400":
          description: |
            Upload rejected. `reason` is one of:
            - `No file part in the request`
            - `No selected file`
            - `File type not allowed`
            - `File is too large`
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeError"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeError"
              example:
                type: error
                reason: Not Admin
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/phishingpictures/{questionID}:
    get:
      tags: [Question Images]
      summary: Get a question's image
      description: |
        **Auth: Login** (any authenticated user).

        Returns the question's screenshot as binary. The content type is sniffed from
        the stored bytes' magic numbers (`image/png`, `image/jpeg`, `image/gif`;
        anything unrecognized is served as `application/octet-stream`).

        When the question no longer exists (deleted from the bank), the endpoint
        falls back to the frozen answer snapshots that reference the image, so graded
        tests can always re-display their emails. `404` only when neither exists.
      security:
        - cookieAuth: []
      parameters:
        - name: questionID
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Image binary (content type sniffed from magic bytes)
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            application/octet-stream:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No live question and no answer snapshot references this ID

  /api/phishingpictures/{questionID}/links:
    get:
      tags: [Question Images]
      summary: Get clickable link areas
      description: |
        **Auth: Login** (any authenticated user).

        Returns the clickable link rectangles defined on the question's image,
        ordered by ID. Coordinates are returned as **percentage strings** (e.g.
        `"15%"`), relative to the image dimensions. The student test payload
        (`GET /api/student/questions`) carries the same anchors as fractional
        strings instead -- the two representations describe the same stored values.
      security:
        - cookieAuth: []
      parameters:
        - name: questionID
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of clickable areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuestionLink"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No live question and no answer snapshot references this ID

    post:
      tags: [Question Images]
      summary: Replace clickable link areas
      description: |
        **Auth: Admin** (note: non-admins get the plain-text body `Error: Not Admin`
        with **HTTP 200** on this endpoint).

        Replaces **all** clickable areas of the question's image: existing areas are
        deleted first, then one area is created per submitted rectangle. Coordinates
        are fractions of the image dimensions (`0.0`--`1.0`) and **must be numeric** --
        they are stored as text without validation, and non-numeric values (e.g.
        `null`) permanently break the GET for this image. A body without an
        `areas` key deletes nothing and returns `OK`.
      security:
        - cookieAuth: []
      parameters:
        - name: questionID
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [areas]
              properties:
                areas:
                  type: array
                  items:
                    type: object
                    required: [url, x, y, width, height]
                    properties:
                      url:
                        type: string
                        description: The URL shown in the hover tooltip
                        example: http://example.com
                      x:
                        type: number
                        format: float
                        description: X position (0.0 to 1.0)
                        example: 0.15
                      y:
                        type: number
                        format: float
                        description: Y position (0.0 to 1.0)
                        example: 0.42
                      width:
                        type: number
                        format: float
                        description: Width (0.0 to 1.0)
                        example: 0.20
                      height:
                        type: number
                        format: float
                        description: Height (0.0 to 1.0)
                        example: 0.03
      responses:
        "200":
          description: |
            `OK` on success (plain text). Non-admins get `Error: Not Admin`
            (also HTTP 200).
          content:
            text/html:
              schema:
                type: string
                example: OK
        "400":
          $ref: "#/components/responses/InvalidBodyText"
        "404":
          description: No live question and no answer snapshot references this ID
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Students (Admin)
  # ──────────────────────────────────────────────

  /api/admin/students:
    get:
      tags: [Students (Admin)]
      summary: List all students
      description: |
        **Auth: Admin** (non-admins get the plain-text body `Error: Not Admin` with HTTP 200).

        Returns all students (newest first) with progress and test statistics.
        Finished students are served from their frozen result row; unfinished ones
        are graded live from their answer snapshots.

        **Blank-field contract:** for a student with no dealt test yet, the grading
        fields (`totalidentifiedcorrectly`, `testgrade`, ...) are empty strings `""`
        and `answeredquestioncount` is `null`.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/students/{studentID}:
    get:
      tags: [Students (Admin)]
      summary: Get student details
      description: |
        **Auth: Admin or self** -- a student session may fetch its own record (this is
        how the results page works); anyone else who is not an admin gets the
        plain-text body `Error: Not Admin` with HTTP 200.

        Returns the student's account data (including the `passcode`, so an
        administrator can rescue a student who lost their access code) and the same
        statistics block as the list endpoint.
      security:
        - cookieAuth: []
      parameters:
        - name: studentID
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentDetail"
        "404":
          description: "Student not found (plain-text body `Error: Student not found`)"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/students/{studentID}/delete:
    post:
      tags: [Students (Admin)]
      summary: Delete a student
      description: |
        **Auth: Admin** (403 otherwise; non-POST methods return 405).

        Permanently removes the student account together with their dealt test,
        answers and result row (database cascade). Question images are never touched
        (they live in the upload-only images table).
      security:
        - cookieAuth: []
      parameters:
        - name: studentID
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Student deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "403":
          $ref: "#/components/responses/NotAdminText"
        "404":
          description: "Student not found (plain-text body `Error: Student not found`)"
        "405":
          description: Method not allowed (only POST)
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/students/{studentID}/answers:
    get:
      tags: [Students (Admin)]
      summary: Get a student's graded answers
      description: |
        **Auth: Admin or self** -- a student session may fetch its own answers (the
        results-page review); anyone else who is not an admin gets the plain-text
        body `Error: Not Admin` with HTTP 200.

        Returns the student's per-question review, graded from the frozen snapshot:
        the correct verdict, the student's verdict, per-option expected and selected
        values, and the points earned per question.

        Note: there is no finished-check on the self-access path -- the response
        includes the correct answers even while the student is still taking the test.
      security:
        - cookieAuth: []
      parameters:
        - name: studentID
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Graded answers, one entry per dealt question
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentAnswer"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Administrators
  # ──────────────────────────────────────────────

  /api/admin/administrators:
    get:
      tags: [Administrators]
      summary: List all administrators
      description: |
        **Auth: Admin** (non-admins get the plain-text body `Error: Not Admin` with HTTP 200).

        Returns all administrator accounts ordered by ID. Password hashes are never
        exposed.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: List of administrator accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Administrator"
        "401":
          $ref: "#/components/responses/Unauthorized"

    post:
      tags: [Administrators]
      summary: Create, update, or delete an administrator
      description: |
        **Auth: Admin** (non-admins get the plain-text body `Error: Not Admin` with HTTP 200).

        One endpoint, dispatched on `action`:

        - **Create**: `action: insertupdate` with `id: ""`. Requires a password of at
          least 8 characters (and at most 72 bytes -- the bcrypt input limit) and a
          free email.
        - **Update**: `action: insertupdate` with an existing `id`. Updates email
          (must stay unique) and enabled flag; the password is re-hashed only when a
          non-empty one is submitted (empty string keeps the current password).
          Disabling your **own** account is refused.
        - **Delete**: `action: delete` with the `id`. Deleting your **own** account is
          refused, so at least one working administrator always remains.

        Passwords are hashed with bcrypt (12 rounds). Validation failures come back
        as `{"type": "error", "reason": ...}` with HTTP 200; only a malformed body
        yields a 400.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - title: Create or Update
                  type: object
                  required: [action, id, email, password, enabled]
                  properties:
                    action:
                      type: string
                      enum: [insertupdate]
                    id:
                      type: string
                      description: "Empty string `\"\"` to create, existing ID to update"
                    email:
                      type: string
                      format: email
                    password:
                      type: string
                      description: >
                        Min 8 characters, max 72 bytes (UTF-8; the bcrypt input
                        limit). Required for create. When updating, empty string
                        keeps the existing password.
                    enabled:
                      type: integer
                      description: "`1` = enabled, `0` = disabled (disabled accounts cannot log in and lose live sessions)"
                - title: Delete
                  type: object
                  required: [action, id]
                  properties:
                    action:
                      type: string
                      enum: [delete]
                    id:
                      type: string
            examples:
              create:
                summary: Create new admin
                value:
                  action: insertupdate
                  id: ""
                  email: new@admin.com
                  password: longenough
                  enabled: 1
              update:
                summary: Update existing admin (keep password)
                value:
                  action: insertupdate
                  id: "5"
                  email: updated@admin.com
                  password: ""
                  enabled: 1
              delete:
                summary: Delete admin
                value:
                  action: delete
                  id: "5"
      responses:
        "200":
          description: |
            Operation result. `{"type": "ok"}` on success; on failure
            `{"type": "error", "reason": ...}` with reasons such as
            `Password must be at least 8 characters long`,
            `Password must be at most 72 bytes long` (bcrypt input limit),
            `Administrator with this email already exists` (create and edit),
            `You cannot disable your own account` or
            `You cannot delete your own account` (self-lockout guards).
          content:
            application/json:
              schema:
                type: object
                properties:
                  type:
                    type: string
                    enum: [ok, error]
                  reason:
                    type: string
        "400":
          description: Malformed request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TypeError"
              example:
                type: error
                reason: Invalid request body
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Dashboard
  # ──────────────────────────────────────────────

  /api/admin/home:
    get:
      tags: [Dashboard]
      summary: Get dashboard statistics
      description: |
        **Auth: Admin** (non-admins get the plain-text body `Error: Not Admin` with HTTP 200).

        Returns the dashboard counters plus `studentsprogress`: students whose last
        activity is within the last 30 minutes **and** who have a dealt test. A
        student's `lastseen` is written at registration and refreshed only by
        `GET /api/checkauth` and the test endpoints (`/api/student/questions`,
        `/api/student/finish`) -- not by every authenticated request. The admin UI polls this endpoint every
        2 seconds. `phishingtestsize` is `null` until the setting is saved for the
        first time.
      security:
        - cookieAuth: []
      responses:
        "200":
          description: Dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardData"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/admin/update/phishingtestsize:
    post:
      tags: [Dashboard]
      summary: Update the test size
      description: |
        **Auth: Admin** (403 otherwise).

        Sets the number of questions randomly dealt to each new student (stored as
        the `PhishingTestSize` setting; the admin UI offers 9/12/15/21/30). Applies
        only to tests dealt after the change. The value is coerced to an integer and
        must be at least 1 (`400` with `Error: Test size must be at least 1` otherwise).
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phishingtestsize]
              properties:
                phishingtestsize:
                  type: integer
                  example: 9
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusOk"
        "400":
          $ref: "#/components/responses/InvalidBodyText"
        "403":
          $ref: "#/components/responses/NotAdminText"
        "401":
          $ref: "#/components/responses/Unauthorized"

  # ──────────────────────────────────────────────
  # Public (Leaderboard & Slides)
  # ──────────────────────────────────────────────

  /api/leaderboard:
    get:
      tags: [Public]
      summary: Get the leaderboard
      description: |
        **Auth: Public.**

        Returns all students with their grade and progress (newest first -- ranking
        is up to the client; the bundled leaderboard page sorts by grade and by
        default shows only students seen in the last 24 hours). Finished students
        are served from their frozen result row; unfinished ones are graded live.
        Access codes are **not** exposed here.

        Same blank-field contract as the admin list: students without a dealt test
        have `""` in the grading fields and `null` in `answeredquestioncount`.
      responses:
        "200":
          description: Leaderboard entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LeaderboardEntry"

  /api/leaderboard/nextslide:
    get:
      tags: [Public]
      summary: Get a random slide image
      description: |
        **Auth: Public.**

        Returns one randomly chosen image from the slides directory
        (`SLIDES_DIRECTORY`, managed through the slides filebrowser) as a binary
        response. Accepted extensions: `.png`, `.jpg`, `.jpeg`, `.gif`, `.webp`.
        The projector kiosk page calls this endpoint to preload the next slide while
        the leaderboard is showing.
      responses:
        "200":
          description: Slide image binary
          content:
            image/png:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
            image/gif:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
        "404":
          description: Slides directory missing or empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                      - Slides directory not found
                      - No slide images found

# ──────────────────────────────────────────────────
# Components
# ──────────────────────────────────────────────────

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
      description: |
        Session cookie set by `POST /api/login`. Database-backed, expires when the
        browser closes. `HttpOnly` -- scripts can never read it; logout goes
        through `POST /api/logout`, which deletes the session server-side and
        clears the cookie.

  responses:
    Unauthorized:
      description: "Not authenticated (plain-text body `Unauthorized`)"
      content:
        text/html:
          schema:
            type: string
            example: Unauthorized
    NotAdminText:
      description: "Not an admin (plain-text body `Error: Not Admin`)"
      content:
        text/html:
          schema:
            type: string
            example: "Error: Not Admin"
    InvalidBodyText:
      description: "Malformed JSON body (plain-text body `Error: Invalid request body`)"
      content:
        text/html:
          schema:
            type: string
            example: "Error: Invalid request body"

  schemas:

    StatusOk:
      type: object
      properties:
        status:
          type: string
          example: ok

    TypeError:
      type: object
      properties:
        type:
          type: string
          enum: [error]
        reason:
          type: string

    AdminAuth:
      type: object
      properties:
        id:
          type: string
          description: Admin email (login name)
          example: admin@admin.com
        userid:
          type: integer
          description: Database primary key
          example: 1
        admin:
          type: integer
          enum: [1]
          example: 1

    StudentAuth:
      type: object
      properties:
        id:
          type: string
          description: Student username (login name)
          example: JOHN_DOE
        userid:
          type: integer
          description: Database primary key
          example: 5
        admin:
          type: integer
          enum: [0]
          example: 0
        passcode:
          type: string
          description: The student's access code
          example: "48291037"
        phishingtestfinished:
          type: integer
          description: "`0` = in progress, `1` = finished"
          example: 0

    StudentQuestion:
      type: object
      properties:
        questionid:
          type: integer
        selectedanswer:
          type: integer
          nullable: true
          description: "`1` = Phishing, `0` = Real, `null` = not answered"
        question:
          type: string
          description: Optional extra instruction ("Papildomai"); empty string when unset
        questionoptions:
          type: array
          items:
            type: object
            properties:
              answeroptionid:
                type: integer
              answeroption:
                type: string
                description: Option text
              isselected:
                type: integer
                nullable: true
                description: "`1` = selected, `0` = deselected, `null` = never touched"

    AdminQuestion:
      type: object
      properties:
        questionid:
          type: integer
        isenabled:
          type: integer
          description: "`1` = dealt to students, `0` = disabled"
        isphishing:
          type: integer
          description: "`1` = phishing, `0` = real"
        questiontext:
          type: string
        questionoptions:
          type: array
          items:
            type: object
            properties:
              optionid:
                type: integer
              optiontext:
                type: string
              rightoptionanswer:
                type: integer
                nullable: true
                description: "`1` = should be checked, `0` = should not, `null` = never set (never counts as correct)"
        created:
          type: string
          description: Creation timestamp (`YYYY-MM-DD HH:MM:SS`, local time)
          example: "2025-01-15 14:30:00"

    QuestionLink:
      type: object
      properties:
        id:
          type: integer
        url:
          type: string
          example: http://example.com
        x:
          type: string
          description: X position as a percentage string
          example: "15%"
        y:
          type: string
          description: Y position as a percentage string
          example: "42%"
        width:
          type: string
          nullable: true
          description: Width as a percentage string
          example: "20%"
        height:
          type: string
          nullable: true
          description: Height as a percentage string
          example: "3%"

    StudentDetail:
      type: object
      properties:
        id:
          type: integer
          description: Student ID
        username:
          type: string
        passcode:
          type: string
          description: The student's access code (plaintext by design)
        questioncount:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: "Dealt questions; the empty string `\"\"` when no test dealt yet"
        answeredquestioncount:
          type: integer
          nullable: true
          description: "Questions with a verdict so far (`null` when no test dealt yet)"
        totalidentifiedcorrectly:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: Questions where the Real/Phishing verdict was correct (`""` when no test dealt yet)
        fullycorrectcount:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: Questions where the verdict and every option were correct (`""` when no test dealt yet)
        fullycorrectpercentage:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: Fully-correct share as a truncated integer percentage (`""` when no test dealt yet)
        totaloptionscount:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: Options across the dealt questions (`""` when no test dealt yet)
        totalcorrectoptionscount:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: Correctly answered options (`""` when no test dealt yet)
        testgrade:
          type: string
          description: Grade on the 10-point scale as a fixed 2-decimal string (e.g. `"7.50"`)
        isfinished:
          type: integer
          description: "`0` = in progress, `1` = finished"
        lastseen:
          type: string
          description: |
            Last activity timestamp (`YYYY-MM-DD HH:MM:SS`). Written at registration
            and refreshed by `GET /api/checkauth` and the test endpoints -- not by
            every authenticated request. `""` for accounts registered before
            lastseen stamping existed that never logged in.
        registrationtime:
          type: string
          description: Registration timestamp (`""` for accounts created before the column existed)
        status:
          type: integer
          description: "`1` = active; other values block login"

    StudentAnswer:
      type: object
      properties:
        id:
          type: integer
          description: Question ID (of the snapshot)
        questiontext:
          type: string
        isphishinganswer:
          type: integer
          nullable: true
          description: "Student's verdict (`1` = Phishing, `0` = Real, `null` = unanswered)"
        isphishing:
          type: integer
          description: "Correct verdict (`1` = phishing, `0` = real)"
        totaloptionscount:
          type: integer
        correctoptionscount:
          type: integer
        answerpoints:
          type: string
          description: |
            Points for this question as a 2-decimal string (e.g. `"1.00"`).
            0 when the verdict is wrong; otherwise 1 minus 0.1 per missed option.
        answeredoptions:
          type: array
          items:
            type: object
            properties:
              optiontext:
                type: string
              rightansweroption:
                type: integer
                nullable: true
                description: Expected value (`1` = should be checked, `0` = should not)
              selectedansweroption:
                type: integer
                description: "Student's selection (`1` = checked, `0` = unchecked; untouched counts as `0`)"

    Administrator:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
          format: email
        enabled:
          type: integer
          description: "`1` = enabled, `0` = disabled"
        lastseen:
          type: string
          description: Last activity timestamp

    DashboardData:
      type: object
      properties:
        studentscount:
          type: integer
          description: Total registered students
        enabledquestionscount:
          type: integer
          description: Number of enabled questions
        totalquestionscount:
          type: integer
          description: Total questions (enabled + disabled)
        phishingtestsize:
          type: integer
          nullable: true
          description: Current test size setting (null if never set)
        studentsprogress:
          type: array
          description: Students active in the last 30 minutes that have a dealt test
          items:
            type: object
            properties:
              studentid:
                type: integer
              username:
                type: string
              questioncount:
                type: integer
              answeredquestioncount:
                type: integer
              isfinished:
                type: integer
              lastlogin:
                type: string

    LeaderboardEntry:
      type: object
      properties:
        id:
          type: integer
          description: Student ID
        username:
          type: string
        questioncount:
          oneOf:
            - type: integer
            - type: string
              enum: [""]
          description: "Dealt questions; the empty string `\"\"` when no test dealt yet"
        answeredquestioncount:
          type: integer
          nullable: true
          description: "Questions answered so far (`null` when no test dealt yet)"
        testgrade:
          type: string
          description: Grade on the 10-point scale as a fixed 2-decimal string (e.g. `"8.50"`)
        isfinished:
          type: integer
          description: "`0` = in progress, `1` = finished"
        lastseen:
          type: string
          description: Last activity timestamp
